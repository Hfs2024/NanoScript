<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NS Ghost State – Live Test</title>

    <style>
        body {
            background: #f0f0f0;
            color: #222;
            font-family: system-ui, sans-serif;
            transition: background 0.3s, color 0.3s;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: inherit;
            padding: 2rem 3rem;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            text-align: center;
            border: 1px solid #ccc;
            max-width: 100%;
        }

        button {
            padding: 10px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            background: #0077ff;
            color: white;
            transition: background 0.2s, transform 0.1s;
            margin-top: 10px;
            white-space: nowrap;
        }

        button:hover {
            background: #005fcc;
        }

        button:active {
            transform: scale(0.96);
        }

        code {
            background: rgba(0, 0, 0, 0.06);
            padding: 2px 8px;
            border-radius: 6px;
            font-family: monospace;
        }

        input {
            padding: 10px;
            font-weight: bold;
            border-radius: 20px;
            border: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🆒 NS Drafts</h1>
        <p>Type something, click <code>Ctrl+R</code> and all data you entered will be saved!</p>
        <input id="username-input" type="text" placeholder="Enter your name..." /></br></br>
        <button id="clear-username-btn">Clear</button>
    </div>

    <script src="../../main.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="../drafts/drafts.js"></script>

    <script>
        async function start() {
            const app1 = NS.drafts.createInstance("app1");
            await NS.drafts.load("my-branch", app1); 

            NS("#username-input").on("input", async function () {
                await NS.drafts.save("my-branch", {
                    "#username-input": {
                        index: 0,
                        value: NS("#username-input").getVal()[0]
                    }
                }, app1);
            });

            NS("#clear-username-btn").on("click", async function () {
                await NS.drafts.removeKey("my-branch", "#username-input", app1);
                NS("#username-input").setVal("");
            });
        }

        start();
    </script>
</body>

</html>
